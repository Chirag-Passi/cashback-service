spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motos}
    username: ${DB_USERNAME:motos}
    password: ${DB_PASSWORD:motos}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.js.motos.clientApp: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
  security:
    encryption-key: ${DATA_ENCRYPTION_KEY:ZGV2LW9ubHktYWVzLTI1Ni1rZXktMzJieXRlcyEhISE=}
  otp:
    dev-mode: ${OTP_DEV_MODE:true}
  cloudinary:
    enabled: ${CLOUDINARY_ENABLED:false}