# Local Postgres for development. Production uses Neon.
services:
  postgres:
    image: postgres:16-alpine
    container_name: motos-postgres
    environment:
      POSTGRES_USER: motos
      POSTGRES_PASSWORD: motos
      POSTGRES_DB: motos
    ports:
      - "5432:5432"
    volumes:
      - motos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motos -d motos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  motos-pgdata: